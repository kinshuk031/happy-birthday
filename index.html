<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Something ✦</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #contentFrame {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }

    #bgMusic {
      display: none;
    }

    #musicToggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;

      padding: 10px 15px;
      border: 1px solid rgba(244,240,231,.55);
      background: rgba(15,13,11,.45);
      color: white;

      font-family: monospace;
      font-size: 10px;
      letter-spacing: .14em;

      cursor: pointer;
      backdrop-filter: blur(7px);
    }
  </style>
</head>

<body>

  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <iframe
    id="contentFrame"
    src="home.html"
    title="Birthday Website">
  </iframe>

  <button id="musicToggle">♫ TAP FOR MUSIC</button>

  <script>
    const music = document.getElementById("bgMusic");
    const button = document.getElementById("musicToggle");

    async function startMusic() {
      try {
        await music.play();

        button.textContent = "♫ MUSIC ON";

      } catch (error) {
        button.textContent = "♫ TAP FOR MUSIC";
      }
    }

    button.addEventListener("click", startMusic);

    window.startBirthdayMusic = startMusic;

    window.addEventListener("message", (event) => {

      if (event.data === "START_MUSIC") {
        startMusic();
      }

    });
  </script>

</body>
</html>
