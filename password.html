<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Private Entry ✦</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="page page-password">

  <!-- PUT YOUR PASSWORD PAGE BACKGROUND IMAGE URL HERE IN style.css -->

  <div class="bg-layer"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <main class="password-wrap">

    <div class="mini-label">
      PRIVATE MEMORY // ACCESS 01
    </div>

    <div class="password-card">

      <span class="card-star">✦</span>

      <div class="password-script">
        a little secret awaits
      </div>

      <h1>
        unlock the memory
      </h1>

      <p>
        enter the secret password to continue...
      </p>

      <form id="passwordForm">

        <input
          id="passwordInput"
          type="password"
          inputmode="numeric"
          maxlength="12"
          aria-label="Password"
        >

        <button class="retro-button small" type="submit">
          <span>UNLOCK</span>
          <i>→</i>
        </button>

      </form>

      <div
        id="passwordMessage"
        class="password-message"
      ></div>

    </div>

    <a class="tiny-back" href="index.html">
      ← back
    </a>

  </main>

  <script src="script.js"></script>

</body>
</html>
