<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Letter ✦</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shadows+Into+Light&display=swap" rel="stylesheet">

<body class="page page-three">

  <!-- PUT YOUR PAGE 3 BACKGROUND IMAGE URL HERE IN style.css -->

  <div class="bg-layer"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>


  <main class="letter-scene">

    <div class="letter-wrap">

      <div class="paper-tape tape-a"></div>
      <div class="paper-tape tape-b"></div>


      <article class="letter-paper">

        <div class="letter-meta">
          DEAR YOU / 01
        </div>


        <!-- WRITE YOUR HEADING HERE -->

        <h1>
          YOUR HEADING HERE
        </h1>


        <!-- WRITE YOUR LETTER HERE -->

        <div class="letter-content">

          <p>
            WRITE YOUR LETTER CONTENT HERE.
          </p>

          <p>
            ADD AS MANY LINES OR PARAGRAPHS AS YOU WANT.
          </p>

          <p>
            THE TEXT WILL APPEAR IN A HANDWRITTEN STYLE.
          </p>

        </div>


        <div class="letter-sign">
          ♡
        </div>

      </article>


      <!-- LETTER IMAGE -->

      <figure class="letter-photo">

        <!-- ADD LETTER PHOTO URL HERE -->
        <img src="https://scontent.fknu2-1.fna.fbcdn.net/v/t1.15752-9/774664602_941296905683360_2295788724520724143_n.jpg?stp=dst-jpg_s960x960_tt6&_nc_cat=106&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=9f807c&_nc_ohc=1KwdHWGo6PAQ7kNvwGSfHLW&_nc_oc=AdqOTP0RFmEzvz9kpIQoIVtcFYHGOWj631HNOLC8MnEjyXvNzKBEKL8FTuBaR0Jym_A&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=scontent.fknu2-1.fna&_nc_ss=7a22e&oh=03_Q7cD6AGJw6a7WGCJUtIBMINF_mI45xrqTakdtlGiQaB5HsDzrw&oe=6AAA5BED" alt="Letter memory">

        <figcaption>
          one of my favorites
        </figcaption>

      </figure>

    </div>


    <!-- NEXT BUTTON -->

    <a
      class="retro-button page-next letter-next"
      href="page4.html"
    >

      <span>
        NEXT MEMORY
      </span>

      <i>
        →
      </i>

    </a>

  </main>

  <script src="script.js"></script>

</body>
</html>
