<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Letter ✦</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Shadows+Into+Light&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body class="page page-three">

  <!-- PUT YOUR PAGE 3 BACKGROUND IMAGE URL HERE IN style.css -->

  <div class="bg-layer"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>


  <main class="letter-scene">

    <div class="letter-wrap">

      <div class="paper-tape tape-a"></div>
      <div class="paper-tape tape-b"></div>


      <article class="letter-paper">

        <div class="letter-meta">
          DEAR YOU / 01
        </div>


        <!-- WRITE YOUR HEADING HERE -->

        <h1>
          YOUR HEADING HERE
        </h1>


        <!-- WRITE YOUR LETTER HERE -->

        <div class="letter-content">

          <p>
            WRITE YOUR LETTER CONTENT HERE.
          </p>

          <p>
            ADD AS MANY LINES OR PARAGRAPHS AS YOU WANT.
          </p>

          <p>
            THE TEXT WILL APPEAR IN A HANDWRITTEN STYLE.
          </p>

        </div>


        <div class="letter-sign">
          ♡
        </div>

      </article>


      <!-- LETTER IMAGE -->

      <figure class="letter-photo">

        <!-- ADD LETTER PHOTO URL HERE -->
        <img src="" alt="Letter memory">

        <figcaption>
          one of my favorites
        </figcaption>

      </figure>

    </div>


    <!-- NEXT BUTTON -->

    <a
      class="retro-button page-next letter-next"
      href="page4.html"
    >

      <span>
        NEXT MEMORY
      </span>

      <i>
        →
      </i>

    </a>

  </main>

  <script src="script.js"></script>

</body>
</html>
