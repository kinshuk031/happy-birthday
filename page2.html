<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="page page-two">

  <!-- PUT YOUR PAGE 2 BACKGROUND IMAGE URL HERE IN style.css -->

  <div class="bg-layer"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <main class="birthday-collage">

    <div class="archive-stamp">
      BIRTHDAY ARCHIVE
    </div>

    <div class="date-label">
      ROLL 01 • FAVORITE MOMENTS
    </div>


    <!-- IMAGE 1 -->
    <figure class="photo-frame photo-1">

      <!-- ADD IMAGE 1 URL HERE -->
      <img src="" alt="Birthday memory 1">

      <figcaption>
        memory / 01
      </figcaption>

    </figure>


    <!-- IMAGE 2 -->
    <figure class="photo-frame photo-2">

      <!-- ADD IMAGE 2 URL HERE -->
      <img src="" alt="Birthday memory 2">

      <figcaption>
        memory / 02
      </figcaption>

    </figure>


    <!-- CENTER -->

      <div class="center-top">
        today is all about you
      </div>

      <h1>

        <span>
          HAPPY
        </span>

        <strong>
          BIRTHDAY
        </strong>

      </h1>

      <div class="center-bottom">
        ✦ another beautiful chapter ✦
      </div>

    </section>


    <!-- IMAGE 3 -->
    <figure class="photo-frame photo-3">

      <!-- ADD IMAGE 3 URL HERE -->
      <img src="" alt="Birthday memory 3">

      <figcaption>
        memory / 03
      </figcaption>

    </figure>


    <!-- IMAGE 4 -->

      <!-- ADD IMAGE 4 URL HERE -->
      <img src="" alt="Birthday memory 4">

      <figcaption>
        memory / 04
      </figcaption>

    </figure>


    <!-- NEXT PAGE BUTTON -->
    <a
      class="retro-button page-next"

    >

      <span>

      </span>

        →
      </i>

    </a>

  </main>
